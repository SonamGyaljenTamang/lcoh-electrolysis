# Example scenario. Any field left out keeps its default from lcoh/params.py.
# Units: currency/kW, kWh/kg, hours, fractions (0.07 = 7 %).

[project]
rated_power_mw = 20.0
lifetime_years = 25
wacc = 0.07
electricity_price_per_mwh = 55.0   # flat price, used without --price-csv
capacity_factor = 0.60             # used without an availability profile
water_price_per_m3 = 2.5
currency = "USD"
stack_wear_basis = "operating"     # or "full_load"

[alkaline]
