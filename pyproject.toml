[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcoh-electrolysis"
version = "0.1.0"
description = "Levelised cost of hydrogen: PEM vs alkaline water electrolysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lcoh = "lcoh.cli:main"

[tool.setuptools]
packages = ["lcoh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
